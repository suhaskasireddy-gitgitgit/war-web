<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>WAR dev</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0e14">
    <!-- Home-screen install. Files are copied in by tools/ship.sh, not shipped through
         Assets/ — Unity would import the PNGs as textures and skip the manifest. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="dev-apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="dev-icon-192.png">
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: #0b0e14; color: #cfd6e4; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Inset by the notch, the Dynamic Island and the home indicator.
         Unity cannot do this itself: Screen.safeArea reports the whole screen in a WebGL
         build, so SafeArea.cs insets nothing and the HUD ran under the black bar.

         The insets go on this wrapper, never on the canvas. A canvas is a replaced element,
         so width:auto resolves from its intrinsic size — the width attribute Unity rewrites
         every frame to match the element. Setting it fed the buffer size back into the
         layout size, which grew both without bound until iOS Safari killed the tab. */
      #stage {
        position: fixed;
        top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left); right: env(safe-area-inset-right);
      }
      #unity-canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: block; background: #0b0e14;
        touch-action: none;   /* browser must not steal drags from the joystick */
      }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0b0e14; z-index: 10; text-align: center; padding: 24px;
      }
      #title { font-size: 34px; font-weight: 700; letter-spacing: 6px; color: #e8eefc; }
      #sub { font-size: 13px; opacity: .55; letter-spacing: 1px; }
      #bar { width: min(260px, 60vw); height: 4px; border-radius: 2px; background: #1d2432; overflow: hidden; }
      #bar > div { height: 100%; width: 0%; background: #4a8cff; transition: width .15s linear; }
      #rotate {
        position: fixed; inset: 0; display: none; z-index: 20;
        align-items: center; justify-content: center; background: #0b0e14;
        font-size: 18px; letter-spacing: 2px;
      }
      body.portrait #rotate { display: flex; }
      #update {
        position: fixed; z-index: 30; display: none; cursor: pointer;
        left: 50%; transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 20px; border-radius: 999px;
        background: #4a8cff; color: #fff; font-size: 14px; font-weight: 600;
        box-shadow: 0 4px 16px rgba(0,0,0,.45);
      }
      /* Bottom-left is the one edge free on the loading and hero-select screens. During a
         match the in-game button takes over, because every corner belongs to the HUD —
         the minimap alone covers the top-left down to half the screen on a phone. */
      #report {
        position: fixed; z-index: 30; display: none; cursor: pointer;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: calc(12px + env(safe-area-inset-left));
        padding: 9px 15px; border-radius: 999px;
        background: rgba(58,42,16,.92); border: 1px solid rgba(255,179,71,.45);
        color: #ffb347; font-size: 13px; font-weight: 600; letter-spacing: .4px;
      }
      body.can-report #report { display: block; }
      body.in-match #report { display: none; }
      #report-sheet {
        position: fixed; inset: 0; z-index: 40; display: none;
        align-items: center; justify-content: center;
        background: rgba(6,9,15,.82); padding: 20px;
      }
      body.reporting #report-sheet { display: flex; }
      #report-card {
        width: min(420px, 100%); background: #131824; border-radius: 14px;
        padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
      }
      #report-card h3 { margin: 0 0 4px; font-size: 16px; color: #e8eefc; font-weight: 600; }
      #report-card p { margin: 0 0 12px; font-size: 12px; opacity: .5; }
      #report-text {
        width: 100%; box-sizing: border-box; height: 96px; resize: none;
        background: #0b0e14; border: 1px solid #232c3e; border-radius: 8px;
        color: #cfd6e4; font: inherit; font-size: 14px; padding: 10px;
        -webkit-user-select: text; user-select: text;
      }
      #report-row { display: flex; gap: 8px; margin-top: 12px; }
      #report-row button {
        flex: 1; padding: 11px; border: 0; border-radius: 8px;
        font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      #report-cancel { background: #202839; color: #9fabc2; }
      #report-send { background: #4a8cff; color: #fff; }
      #report-send[disabled] { opacity: .5; }

      /* The name sheet borrows the report sheet's card, because it is the same object: a
         DOM input over the canvas, which is the only way a phone gets a keyboard here. */
      #name-sheet {
        position: fixed; inset: 0; z-index: 41; display: none;
        align-items: center; justify-content: center;
        background: rgba(6,9,15,.82); padding: 20px;
      }
      body.naming #name-sheet { display: flex; }
      #name-card {
        width: min(420px, 100%); background: #131824; border-radius: 14px;
        padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
      }
      #name-card h3 { margin: 0 0 4px; font-size: 16px; color: #e8eefc; font-weight: 600; }
      #name-card p { margin: 0 0 12px; font-size: 12px; opacity: .5; }
      #name-input {
        width: 100%; box-sizing: border-box;
        background: #0b0e14; border: 1px solid #232c3e; border-radius: 8px;
        color: #e8eefc; font: inherit; font-size: 18px; padding: 12px;
        -webkit-user-select: text; user-select: text;
      }
      #name-row { display: flex; gap: 8px; margin-top: 12px; }
      #name-row button {
        flex: 1; padding: 11px; border: 0; border-radius: 8px;
        font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      #name-cancel { background: #202839; color: #9fabc2; }
      #name-save { background: #4a8cff; color: #fff; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

    <div id="overlay">
      <div id="title">WAR dev</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="sub">loading</div>
    </div>
    <div id="rotate">↻&nbsp; turn your phone sideways</div>
    <div id="update" onclick="location.reload()">new build available &nbsp;·&nbsp; tap to update</div>

    <div id="report" title="Report something">⚑&nbsp; Report</div>
    <div id="report-sheet">
      <div id="report-card">
        <h3>What happened?</h3>
        <p>Goes straight to Discord with your match seed attached.</p>
        <textarea id="report-text" placeholder="tower did nothing when I hit it&#10;ult felt way too strong&#10;froze at ~8 min"></textarea>
        <div id="report-row">
          <button id="report-cancel">Cancel</button>
          <button id="report-send">Send</button>
        </div>
      </div>
    </div>

    <div id="name-sheet">
      <div id="name-card">
        <h3>Your name</h3>
        <p>Shown on your profile. Letters, numbers, up to 16 characters.</p>
        <input id="name-input" type="text" maxlength="16" autocomplete="off"
               autocapitalize="words" autocorrect="off" spellcheck="false"
               enterkeyhint="done" placeholder="Ash Warden">
        <div id="name-row">
          <button id="name-cancel">Cancel</button>
          <button id="name-save">Save</button>
        </div>
      </div>
    </div>

    <script>
      var canvas  = document.querySelector("#unity-canvas");
      var overlay = document.querySelector("#overlay");
      var fill    = document.querySelector("#fill");
      var sub     = document.querySelector("#sub");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
                     || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

      function checkOrientation() {
        document.body.classList.toggle("portrait", isMobile && window.innerHeight > window.innerWidth);
      }
      // Landscape lock lives here rather than in MatchRunner's Awake, which used to set
      // Screen.orientation. That call is screen.orientation.lock() underneath, and on a
      // desktop it rejects — "not available on this device" — as an unhandled error on every
      // single boot, which is noise in exactly the console you go to when something is wrong.
      // The page already knows what a phone is, and can swallow the rejection. iOS Safari
      // does not implement the API at all, which is what #rotate is for.
      function lockLandscape() {
        if (!isMobile || !screen.orientation || !screen.orientation.lock) return;
        screen.orientation.lock("landscape").catch(function () { /* needs fullscreen, or unsupported */ });
      }
      lockLandscape();

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
      checkOrientation();

      // Safari pinch-zooms the page otherwise, which fights the joystick.
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      // Unity's canvas swallows contextmenu so that a game can use the right button. WAR only
      // ever reads button 0 (grep GetMouseButton), so the menu costs nothing — and without it
      // there is no right-click Inspect on the build, which is the first thing anyone reaches
      // for when the page misbehaves. Stopped in the capture phase, before Unity's handler.
      window.addEventListener("contextmenu", function (e) { e.stopPropagation(); }, true);

      // Unity drives its main loop from requestAnimationFrame, which browsers stop firing in a
      // hidden tab — so a match froze the instant you switched away, and Application.runInBackground
      // cannot help, because it is the browser and not Unity that has stopped calling. Fall back
      // to a timer while hidden. Browsers clamp background timers to roughly 1Hz, so the tab
      // renders about once a second; MatchRunner banks wall-clock time rather than Time.deltaTime
      // and catches the simulation up on each of those frames, so the match keeps real time
      // instead of crawling. Must be installed before the loader script runs.
      (function () {
        var raf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          if (document.visibilityState === "visible") return raf(cb);
          return window.setTimeout(function () { cb(performance.now()); }, 16);
        };
      })();

      // A game canvas does not count as activity to the OS the way video does, so the phone
      // dims and locks mid-match. The lock is dropped whenever the page is backgrounded and
      // has to be taken again on the way back.
      var wakeLock = null;
      function keepAwake() {
        if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
        navigator.wakeLock.request("screen").then(function (lock) {
          wakeLock = lock;
          lock.addEventListener("release", function () { wakeLock = null; });
        }).catch(function () { /* denied or unsupported; nothing to fall back to */ });
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && !wakeLock) keepAwake();
      });
      // Safari only grants it off a user gesture, so ask again on the first touch.
      document.addEventListener("pointerdown", function () { if (!wakeLock) keepAwake(); });
      keepAwake();

      // Stamped fresh every build. Appended to each asset URL so a reload is guaranteed to
      // fetch the new build rather than whatever the browser or Unity's IndexedDB kept.
      var BUILD = "20260905-030814";
      var bust = "?v=" + encodeURIComponent(BUILD);

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb" + bust,
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + bust,
        codeUrl: buildUrl + "/Web.wasm.unityweb" + bust,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Suhas Kasireddy",
        productName: "WAR",
        productVersion: "20260905-030814",
        // Phones are 3x DPI; rendering every one of those pixels costs more than it shows.
        devicePixelRatio: isMobile ? Math.min(window.devicePixelRatio || 1, 2) : (window.devicePixelRatio || 1),
      };

      // Nothing running inside the wasm can replace the wasm, so a new deploy needs a page
      // reload. Offered rather than forced: reloading mid-fight would be worse than stale.
      function watchForNewBuild() {
        setInterval(function () {
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (!v || v.version === BUILD) return;
              var bar = document.getElementById("update");
              if (bar) bar.style.display = "block";
            })
            .catch(function () { /* offline; try again next tick */ });
        }, 60000);
      }

      // Feedback used to POST straight to a Discord webhook whose URL was published in
      // playtest.json. A static site cannot keep a secret: the file is world-readable, a
      // scraper found it, and #war-feedback filled up with Telegram adverts posted through
      // it. Anything the browser can send with, anyone can send with.
      //
      // So the browser no longer holds a credential. It formats the report, puts it on the
      // clipboard, and opens the channel for the player to paste into. One extra tap, and
      // nothing worth stealing ships with the build. playtest.json now carries only a
      // channel link, which is useless to anyone who is not already in the server.
      var lastError = "";
      window.addEventListener("error", function (e) {
        lastError = String(e.message || "").slice(0, 300);
      });

      // Deliberately set up before Unity loads: a build that fails to start is exactly the
      // one you most need a report about.
      // A 90-character user-agent buried the actual comment. Only the phone and OS matter.
      function shortDevice() {
        var ua = navigator.userAgent;
        var os = (ua.match(/(?:iPhone )?OS (\d+[._]\d+)/) || [])[1];
        if (/iPad/.test(ua))    return "iPad" + (os ? " " + os.replace("_", ".") : "");
        if (/iPhone/.test(ua))  return "iPhone" + (os ? " " + os.replace("_", ".") : "");
        if (/Android/.test(ua)) return "Android" + ((ua.match(/Android (\d+(?:\.\d+)?)/) || [])[1] || "");
        if (/Mac/.test(ua))     return "Mac";
        if (/Windows/.test(ua)) return "Windows";
        return "desktop";
      }

      // Unity cannot raise a keyboard on WebGL — there is no TouchScreenKeyboard on this
      // player — so the name field is a real DOM input over the canvas, exactly like the
      // report sheet below. Unity opens it through the jslib and the answer comes back by
      // SendMessage; a cancel sends an empty string so the game always gets a reply and
      // never sits waiting on one.
      // Asks the browser to treat this origin's storage as persistent, which matters more
      // here than it looks: the player's account token lives in IndexedDB (Unity's PlayerPrefs
      // are backed by it on WebGL), and the server only ever keeps that token's hash. Evicted
      // storage is not a logout, it is an account nobody can ever reach again.
      //
      // Chromium usually grants this to an installed or engaged site. **It does not save iOS
      // Safari**, which deletes all script-writable storage after seven days of browser use
      // without visiting the site; the only exemption there is being added to the home screen,
      // which is what the in-game install prompt is for. Real recovery needs account binding.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted()
          .then(function (already) { return already || navigator.storage.persist(); })
          .then(function (granted) { window.warStoragePersisted = !!granted; })
          .catch(function () { /* unsupported; nothing is worse than before */ });
      }

      // Account binding leaves the page and comes back. Two halves:
      //
      //  * warBeginLink navigates to Discord. Same tab on purpose - a popup is blocked on
      //    mobile unless it is a direct gesture, and a blocked popup fails silently.
      //  * the callback returns to this URL with ?link=<result>. It is stripped from the
      //    address bar immediately so a refresh cannot replay a stale outcome, then handed
      //    to Unity once it is up. Unity may not exist yet at page load, hence the retry.
      window.warBeginLink = function (url) { window.location.href = url; };

      // Sharing an invite. navigator.share opens the real share sheet on a phone, which is
      // where the link is actually going - a chat with the friend being invited. Clipboard is
      // the desktop fallback. Both are fire-and-forget: a refused share sheet is the player
      // changing their mind, not an error worth reporting into the game.
      window.warShareLink = function (url) {
        if (navigator.share) {
          navigator.share({ title: "WAR", text: "Come fight with me.", url: url })
            .catch(function () { /* dismissed */ });
          return;
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).catch(function () { /* blocked */ });
        }
      };

      (function () {
        var params = new URLSearchParams(window.location.search);
        var result = params.get("link");
        var friend = params.get("friend");
        if (!result && !friend) return;

        params.delete("link");
        params.delete("friend");
        var clean = window.location.pathname + (params.toString() ? "?" + params : "");
        history.replaceState(null, "", clean);

        var tries = 0;
        var timer = setInterval(function () {
          if (++tries > 40) { clearInterval(timer); return; }
          if (!window.unityInstance) return;
          try {
            if (result) window.unityInstance.SendMessage("AccountService", "OnLinkResult", result);
            if (friend) window.unityInstance.SendMessage("AccountService", "OnFriendCode", friend);
            clearInterval(timer);
          } catch (e) { /* not built yet; the next tick tries again */ }
        }, 250);
      })();

      function setupNaming() {
        var sheet  = document.getElementById("name-sheet");
        var input  = document.getElementById("name-input");
        var save   = document.getElementById("name-save");
        var cancel = document.getElementById("name-cancel");

        function reply(value) {
          document.body.classList.remove("naming");
          if (window.unityInstance) window.unityInstance.SendMessage("Home", "OnNameEntered", value);
        }

        window.warOpenName = function (current) {
          input.value = current || "";
          document.body.classList.add("naming");
          // Focused on purpose, unlike the report sheet: there is one field, the player
          // asked for it by tapping their name, and the keyboard is the whole point.
          // select() rather than focus() so typing replaces the old name instead of
          // appending to it.
          setTimeout(function () { input.focus(); input.select(); }, 30);
        };

        save.addEventListener("click", function () { reply(input.value); });
        cancel.addEventListener("click", function () { reply(""); });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); reply(input.value); }
          if (e.key === "Escape") { e.preventDefault(); reply(""); }
        });
        // Tapping the dimmed backdrop is cancel, which is what every sheet on a phone does.
        sheet.addEventListener("click", function (e) { if (e.target === sheet) reply(""); });
      }
      setupNaming();

      function setupFeedback() {
        var sheet  = document.getElementById("report-sheet");
        var text   = document.getElementById("report-text");
        var send   = document.getElementById("report-send");
        var cancel = document.getElementById("report-cancel");
        var channelUrl = "";
        var relayUrl = "";

        fetch("playtest.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (cfg) {
            if (!cfg) return;
            channelUrl = cfg.feedbackUrl || "";
            relayUrl = cfg.feedbackApi || "";
            // Either route is enough to show the button. The relay is one tap; the channel
            // link is the paste fallback, and one of them has to exist for the button to
            // do anything at all.
            if (channelUrl || relayUrl) document.body.classList.add("can-report");
          })
          .catch(function () { /* no config published; button stays hidden */ });

        // Clipboard access needs a secure context. The published build is https so the
        // modern call works there; the wifi preview is plain http, where it does not, and
        // the old execCommand path still does. If both fail the text stays in the box and
        // the player copies it themselves — the report is never lost, only less convenient.
        function copyText(value) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(value);
          }
          return new Promise(function (resolve, reject) {
            var scratch = document.createElement("textarea");
            scratch.value = value;
            scratch.setAttribute("readonly", "");
            scratch.style.position = "fixed";
            scratch.style.opacity = "0";
            document.body.appendChild(scratch);
            scratch.select();
            scratch.setSelectionRange(0, value.length);
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(scratch);
            ok ? resolve() : reject(new Error("copy unavailable"));
          });
        }

        function close() {
          document.body.classList.remove("reporting");
          send.disabled = false;
          send.textContent = "Send";
        }

        // Deliberately no focus() — autofocusing throws the on-screen keyboard over the
        // sheet before the reader has seen it. The keyboard comes up when they tap the box.
        function open() {
          text.value = "";
          document.body.classList.add("reporting");
        }
        window.warOpenReport = open;   // called from Unity's in-game report button

        // A desync reports itself. No sheet, no prompt, no retry: the match has already
        // ended and the player is on their way back to the home screen, so this must never
        // be something they wait for. If it fails it is lost, which is the right trade —
        // the alternative is a dialog about a hash.
        window.warReportDesync = function (json) {
          if (!relayUrl) return;
          var d;
          try { d = JSON.parse(json); } catch (e) { return; }
          fetch(relayUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              kind: "desync",
              seed: d.seed || "",
              build: BUILD,
              device: shortDevice(),
              room: d.room || "",
              tick: d.tick || "",
              slot: d.slot,
              peer: d.peer,
              mine: d.mine || "",
              theirs: d.theirs || "",
              players: d.players,
            }),
            keepalive: true,
          }).catch(function () { /* lost, deliberately */ });
        };

        document.getElementById("report").addEventListener("click", open);

        // Unity publishes match context every few seconds; while a match is live its own
        // button is on screen, so the page one steps aside rather than double up.
        setInterval(function () {
          var ctx = window.warContext;
          document.body.classList.toggle("in-match", !!(ctx && ctx.seed && !ctx.over));
        }, 2000);
        cancel.addEventListener("click", close);
        sheet.addEventListener("click", function (e) { if (e.target === sheet) close(); });

        send.addEventListener("click", function () {
          var body = text.value.trim();
          if (!body) return close();

          var ctx = window.warContext || {};
          var fields = {
            comment: body,
            champion: ctx.champion || "",
            matchTime: ctx.gameTime
              ? Math.floor(ctx.gameTime / 60) + "m" + (ctx.gameTime % 60) + "s" : "",
            autoplay: !!ctx.autoplay,
            over: !!ctx.over,
            seed: ctx.seed || "",
            build: BUILD,
            device: shortDevice(),
            error: lastError || "",
          };

          send.disabled = true;

          // One tap when the relay is up. It holds the webhook; this page holds nothing.
          if (relayUrl) {
            send.textContent = "Sending…";
            fetch(relayUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(fields),
            })
              .then(function (r) {
                if (!r.ok) throw new Error(r.status);
                send.textContent = "Sent — thanks";
                setTimeout(close, 900);
              })
              .catch(function () { pasteFallback(fields); });
            return;
          }

          pasteFallback(fields);
        });

        // Relay down, relay unconfigured, or offline. The report is never lost to a
        // service being unreachable — it goes on the clipboard and the channel opens.
        function pasteFallback(fields) {
          if (!channelUrl) {
            send.disabled = false;
            send.textContent = "Could not send — try again later";
            return;
          }

          var meta = [
            fields.champion, fields.matchTime,
            fields.autoplay ? "autoplay" : "", fields.over ? "match over" : "",
            "seed " + (fields.seed || "—"), fields.build, fields.device,
          ].filter(Boolean);

          var report = fields.comment + "\n-# " + meta.join("  ·  ");
          if (fields.error) report += "\n`" + fields.error + "`";

          copyText(report)
            .then(function () {
              send.textContent = "Copied — paste it in Discord";
              window.open(channelUrl, "_blank", "noopener");
              setTimeout(close, 1200);
            })
            .catch(function () {
              send.disabled = false;
              send.textContent = "Copy it yourself, then paste in Discord";
              text.value = report;
              text.focus();
              text.setSelectionRange(0, report.length);
            });
        }
      }
      setupFeedback();

      function boot() {
        var script = document.createElement("script");
        script.src = buildUrl + "/Web.loader.js" + bust;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            fill.style.width = (100 * progress) + "%";
          }).then(function (unityInstance) {
            overlay.style.display = "none";
            window.unityInstance = unityInstance;
            watchForNewBuild();
          }).catch(function (message) {
            sub.textContent = message;
          });
        };
        document.body.appendChild(script);
      }

      // A stale shell against fresh binaries is a hard crash, not a stale game.
      //
      // This file is what the browser caches; the engine files under Build/ are requested with
      // a version in the query string, so they miss the cache and arrive current. An old cached
      // shell therefore loads *new* binaries with an old loader's expectations, and Unity dies
      // on the spot with "memory access out of bounds" or a stack overflow — a wall of hex
      // where the game should be. Seen twice while testing, both times after a deploy.
      //
      // watchForNewBuild covers the other direction: a page already running when a build lands
      // is offered a reload rather than forced, because reloading mid-fight is worse than
      // stale. It cannot help here, because here nothing gets far enough to poll.
      //
      // Reloads at most once per version. If version.json still disagrees after that, the game
      // is booted anyway — a wrong build the player can quit beats a reload loop they cannot.
      function bootWhenCurrent() {
        fetch("version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            if (!v || !v.version || v.version === BUILD) return boot();
            // Deliberately an ugly name. This marks "already reloaded once for this version",
            // and a short one like `v` is exactly what a shared or hand-edited link carries by
            // accident — which would silently disable the guard for whoever opened it.
            var url = new URL(location.href);
            if (url.searchParams.get("warshell") === v.version) return boot();
            url.searchParams.set("warshell", v.version);
            location.replace(url.toString());
          })
          .catch(boot);   // offline, or no version.json: play what is here
      }

      bootWhenCurrent();
    </script>
